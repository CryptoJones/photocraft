name: Optional ChatGPT sign-in

on:
  push:
    paths:
      - "crates/chatgpt/**"
      - "crates/engine/**"
      - "crates/ui-egui/**"
      - "crates/automation/**"
      - "apps/photocraft/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/chatgpt.yml"
  pull_request:
    paths:
      - "crates/chatgpt/**"
      - "crates/engine/**"
      - "crates/ui-egui/**"
      - "crates/automation/**"
      - "apps/photocraft/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/chatgpt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-sign-in-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounts:
    if: ${{ github.event_name != 'push' || github.event.repository.fork }}
    name: Accounts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: optional-chatgpt
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      # Real loopback callbacks, ephemeral signing keys and simulated token/browser transport.
      # No real sign-in, account secret, inference request or plan usage is needed by CI.
      - name: Test native OAuth and private storage
        run: cargo test -p photocraft-chatgpt --features native --locked
      - name: Test commands and automation isolation
        run: cargo test -p photocraft-engine -p photocraft-automation --features photocraft-engine/chatgpt --locked
      - name: Check native app with optional sign-in
        run: cargo check -p photocraft -p photocraft-ui-egui --features photocraft/chatgpt --locked
      - name: Clippy optional sign-in
        run: cargo clippy -p photocraft-chatgpt -p photocraft-engine -p photocraft --features photocraft/chatgpt --all-targets --locked -- -D warnings
