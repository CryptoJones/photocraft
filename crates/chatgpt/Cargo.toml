[package]
name = "photocraft-chatgpt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
native = ["dep:ureq", "dep:sha2", "dep:base64", "dep:getrandom", "dep:jsonwebtoken", "dep:url", "dep:tempfile", "dep:open"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
photocraft-raster = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { workspace = true, optional = true }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"], optional = true }
url = { version = "2.5", optional = true }
tempfile = { version = "3", optional = true }
open = { version = "5", optional = true }

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
